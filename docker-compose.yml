# Prod: only nginx is published. Set PUBLIC_URL to the public origin (TLS terminated
# upstream, e.g. an ALB, forwarding to nginx:80).
services:
  # Redis runs inside the backend container; set REDIS_URL/REDIS_HOST in .env to use an external one.
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file: ./apps/backend/.env
    volumes:
      - redis-data:/data
    networks:
      - ims-dev-infra
    restart: always

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      # NEXT_PUBLIC_* are inlined into the client bundle at build time. They come from
      # the root .env (see .env.example), NOT apps/frontend/.env — that file holds
      # NEXTAUTH_SECRET, and Next's standalone output would copy it into the image.
      args:
        NEXT_PUBLIC_BASE_API_URL: ${PUBLIC_URL:-https://recruit-local.imssystems.tech}/api
        NEXT_PUBLIC_API_VERSION: v1
        NEXT_PUBLIC_SANITY_PROJECT_ID: ${NEXT_PUBLIC_SANITY_PROJECT_ID:?set it in the root .env}
        NEXT_PUBLIC_SANITY_DATASET: ${NEXT_PUBLIC_SANITY_DATASET:?set it in the root .env}
        NEXT_PUBLIC_APP_BRAND: ${NEXT_PUBLIC_APP_BRAND:-}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    env_file: ./apps/frontend/.env
    environment:
      INTERNAL_API_URL: http://backend:9027/api
      NEXTAUTH_URL: ${PUBLIC_URL:-https://recruit-local.imssystems.tech}
    depends_on: [backend]
    networks:
      - ims-dev-infra
    restart: always

  nginx:
    image: nginx:alpine
    # Local-only: the VPS host nginx terminates TLS and proxies to 127.0.0.1:8080.
    ports:
      - '127.0.0.1:8081:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [frontend, backend]
    networks:
      - ims-dev-infra
    restart: always

networks:
  ims-dev-infra:
    external: true
    name: ims-dev-infra

volumes:
  redis-data:
