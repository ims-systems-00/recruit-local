# Prod: only nginx is published. Set PUBLIC_URL / NEXTAUTH_URL / INTERNAL_API_URL
# (and NEXT_PUBLIC_*) in apps/frontend/.env — Compose does not invent values here.
#
# NEXT_PUBLIC_* are read from apps/frontend/.env during the image build (copied into
# the builder). Runtime secrets come from env_file and never need compose args.
services:
  # Redis runs inside the backend container; set REDIS_URL/REDIS_HOST in .env to use an external one.
  rl_backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file:
      - ./apps/backend/.env
    volumes:
      - redis-data:/data
    networks:
      - ims-dev-infra
    restart: always

  rl_frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    env_file:
      - ./apps/frontend/.env
    depends_on:
      - rl_backend
    networks:
      - ims-dev-infra
    restart: always

  rl_nginx:
    image: nginx:alpine
    # Local-only: the VPS host nginx terminates TLS and proxies to 127.0.0.1:8247.
    ports:
      - '127.0.0.1:8247:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - rl_frontend
      - rl_backend
    networks:
      - ims-dev-infra
    restart: always

networks:
  ims-dev-infra:
    external: true
    name: ims-dev-infra

volumes:
  redis-data:
