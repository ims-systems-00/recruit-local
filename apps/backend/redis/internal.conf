# Config for the Redis bundled inside the backend image. Started by docker-entrypoint.sh
# only when no external Redis is configured (REDIS_URL / REDIS_HOST).

# Loopback only: unreachable from the compose network, so it needs no password.
bind 127.0.0.1 -::1
protected-mode yes
port 6379

# AOF survives `docker restart` on its own; mount a volume at /data to survive redeploys.
dir /data
save ""
appendonly yes
appendfsync everysec

# noeviction is required — BullMQ keeps queue state in plain keys and evicting them corrupts queues.
maxmemory 256mb
maxmemory-policy noeviction

# Empty logfile => stdout => visible in `docker logs`.
logfile ""
